name: Cache zed-editor

on:
  schedule:
    - cron: '0 0 * * 2'   # Tuesday 00:00 UTC
  workflow_dispatch:          # manual trigger too

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v15
        with:
          name: mostlyk
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Merge latex-math onto zed main
        working-directory: ${{ runner.temp }}
        run: |
          git clone -q --filter=blob:none --no-checkout "https://x-access-token:${ZED_FORK_TOKEN}@github.com/MostlyKIGuess/zed.git" zed
          cd zed
          git remote add upstream https://github.com/zed-industries/zed.git
          git fetch -q upstream main
          git fetch -q origin latex-math
          git checkout -q -B latex-math-on-main upstream/main
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          if git merge -q --no-edit origin/latex-math; then
            git push -q -f origin latex-math-on-main
          else
            git merge --abort
            echo "::warning::latex-math conflicts with zed main, keeping the last merged build"
          fi
        env:
          ZED_FORK_TOKEN: ${{ secrets.ZED_FORK_TOKEN }}

      - name: Update flake inputs
        run: nix flake update

      - name: Build and push zed-editor
        run: nix build .#default --print-build-logs

      - name: Commit updated flake.lock
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add flake.lock
          git diff --staged --quiet || git commit -m "chore: update flake.lock"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
